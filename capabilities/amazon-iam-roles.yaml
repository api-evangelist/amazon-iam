        description: Amazon IAM Assume an IAM Role
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Action
          in: query
          type: string
          required: true
        - name: Version
          in: query
          type: string
          required: true
        - name: RoleArn
          in: query
          type: string
          description: The ARN of the role to assume.
          required: true
        - name: RoleSessionName
          in: query
          type: string
          description: An identifier for the assumed role session.
          required: true
        - name: DurationSeconds
          in: query
          type: integer
          description: Duration of the role session in seconds.
        - name: ExternalId
          in: query
          type: string
          description: A unique identifier used by third parties.
    - name: ?Action=CreateRole
      path: /?Action=CreateRole
      operations:
      - name: createrole
        method: GET
        description: Amazon IAM Create a New IAM Role
        outputRawFormat: json
        outputParameters:
        - name: result
