naftiko: "1.0.0-alpha1"
info:
  label: AWS IAM API
  description: Manages IAM users, roles, groups, policies, and access keys for AWS account access control.
  tags:
    - AWS
    - IAM
    - Security
    - Access Control
    - Identity
  created: "2026-04-19"
  modified: "2026-04-19"
binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
capability:
  consumes:
    - type: http
      namespace: iam
      baseUri: https://iam.amazonaws.com
      description: AWS IAM REST API
      authentication:
        type: apikey
        key: Authorization
        value: "{{AWS_ACCESS_KEY_ID}}"
        placement: header
      resources:
        - name: users
          path: /users
          description: IAM users
          operations:
            - name: list-users
              method: GET
              description: List IAM users
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-user
              method: POST
              description: Create an IAM user
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: roles
          path: /roles
          description: IAM roles
          operations:
            - name: list-roles
              method: GET
              description: List IAM roles
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-role
              method: POST
              description: Create an IAM role
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: policies
          path: /policies
          description: IAM policies
          operations:
            - name: list-policies
              method: GET
              description: List IAM policies
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-policy
              method: POST
              description: Create an IAM policy
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
  exposes:
    - type: rest
      port: 8100
      namespace: iam-rest
      resources:
        - path: /v1/users
          name: users
          description: Manage IAM users
          operations:
            - method: GET
              name: list-users
              description: List IAM users
              call: "iam.list-users"
              outputParameters:
                - type: object
                  mapping: "$."
    - type: mcp
      port: 9100
      namespace: iam-mcp
      transport: http
      tools:
        - name: list-users
          description: List IAM users in the account
          hints:
            readOnly: true
          call: "iam.list-users"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-user
          description: Create a new IAM user
          hints:
            readOnly: false
          call: "iam.create-user"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-roles
          description: List IAM roles in the account
          hints:
            readOnly: true
          call: "iam.list-roles"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-role
          description: Create a new IAM role
          hints:
            readOnly: false
          call: "iam.create-role"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-policies
          description: List IAM policies in the account
          hints:
            readOnly: true
          call: "iam.list-policies"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-policy
          description: Create a new IAM policy
          hints:
            readOnly: false
          call: "iam.create-policy"
          outputParameters:
            - type: object
              mapping: "$."
